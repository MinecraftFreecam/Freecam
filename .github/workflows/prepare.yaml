name: Setup

on:
  workflow_call:
    inputs:
      ci_files:
        description: Check whether files in 'ci' or '.github' were touched
        type: boolean
        default: false
      i18n_files:
        description: Check whether i18n files were touched
        type: boolean
        default: false
      release:
        description: Check whether the current project version has been published on GitHub Releases
        type: boolean
        default: false
      matrix:
        description: Build a job matrix
        type: boolean
        default: false
    outputs:
      version:
        description: The current project version
        value: ${{ jobs.prepare.outputs.version }}
      unreleased:
        description: Whether the current project version is not yet published on GitHub Releases
        value: ${{ jobs.prepare.outputs.unreleased }}
      ci_files:
        description: Whether the PR touches files in 'ci' or '.github'
        value: ${{ jobs.prepare.outputs.ci_files }}
      i18n_files:
        description: Whether the PR touches i18n files
        value: ${{ jobs.prepare.outputs.i18n_files }}
      matrix:
        description: The build matrix
        value: ${{ jobs.prepare.outputs.matrix }}
    secrets: {}

permissions: {}

defaults:
  run:
    shell: bash

env:
  # Scopes that can be queried using `contains(env.scopes, 'scope')`
  scopes: >
    ${{ inputs.matrix && 'node' || '' }}
    ${{ inputs.ci_files && 'files' || '' }}
    ${{ inputs.i18n_files && 'files' || '' }}

jobs:
  prepare:
    # If the calling job is named 'Setup', this will render as 'Setup / CI'
    # E.g. 'Build / Setup / CI (pull_request)'
    name: CI
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      # 'read' avoids accidental access to draft releases.
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      unreleased: ${{ steps.check_release.outputs.unreleased }}
      ci_files: ${{ steps.changed_files.outputs.ci }}
      i18n_files: ${{ steps.changed_files.outputs.i18n }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout required files
        if: contains(env.scopes, 'node')
        uses: actions/checkout@v7
        with:
          ref: >
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.sha ||
              github.sha
            }}
          sparse-checkout: |
            ci
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      # Checkout PR metadata separately to support pull_request_target.
      # Trusted CI tooling will deserialize these files as arbitrary user input.
      - name: Checkout PR metadata
        uses: actions/checkout@v7
        with:
          # We intentionally fetch untrusted user input here.
          allow-unsafe-pr-checkout: true
          ref: >
            ${{
              github.event.pull_request.head.sha ||
              github.sha
            }}
          sparse-checkout: |
            metadata.toml
            stonecutter.settings.toml
          sparse-checkout-cone-mode: false

      - name: Install CI dependencies
        if: contains(env.scopes, 'node')
        run: npm ci --workspace ci --omit dev

      - name: Get changed files
        id: changed_files
        if: contains(env.scopes, 'files')
        uses: actions/github-script@v9
        with:
          script: |
            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    files(first: 100) {
                      nodes { path }
                    }
                  }
                }
              }`,
              {
                ...context.repo,
                pr: context.payload.pull_request.number,
              }
            )
            const files = result.repository.pullRequest.files.nodes
            if (files.some(f => f.path.startsWith("ci/") || f.path.startsWith(".github/"))) {
              core.notice("This PR touches ci files")
              core.setOutput("ci", "true")
            }
            if (files.some(f => f.path.startsWith("i18n/"))) {
              core.notice("This PR touches i18n files")
              core.setOutput("i18n", "true")
            }
            if (files.length === 100) {
              core.warning("PR has ≥100 files — file detection may be incomplete")
            }

      - name: Read project version
        id: version
        run: |
          version=$(yq .mod.version metadata.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is released
        id: check_release
        if: inputs.release || inputs.matrix
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag })
              core.notice(`${tag} already published (${data.published_at})`)
            } catch (err) {
              if (err.status !== 404) throw err
              core.notice(`${tag} not published — creating release`)
              core.setOutput("unreleased", "true")
            }

      - name: Generate build matrix
        id: matrix
        if: inputs.matrix
        env:
          unreleased: ${{ steps.check_release.outputs.unreleased }}
          version: ${{ steps.version.outputs.version }}
        run: |
          args=(
            --version "$version"
            --output matrix.json
          )

          # If 'unreleased' is set, that means the version has been bumped, so do a release build.
          if [ -n "$unreleased" ]; then
            args+=( --release )
          fi

          node ci/src/build_matrix.ts "${args[@]}"
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
