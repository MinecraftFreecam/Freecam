name: PR

on:
  pull_request:

# Group workflow runs by PR number.
# New runs cancel any pending run.
# In-progress runs are asked to stop.
concurrency:
  group: pull_request-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Setup
    uses: ./.github/workflows/prepare.yaml
    permissions:
      contents: read
    with:
      matrix: true

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yaml
    permissions:
      contents: read

  build:
    name: Build
    uses: ./.github/workflows/build.yaml
    needs: prepare
    permissions:
      contents: read
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yaml
    needs:
      - prepare
      - build
    permissions:
      contents: write # Needs to match publish.yaml job permissions
    with:
      dry-run: true

  # This meta-job exists only as a target for the 'required status checks' ruleset.
  # It 'needs' all jobs that block merging a PR. Update the 'needs' list as CI requirements evolve.
  status:
    # Important: do not rename this job!
    # The job name is the unique identifier used by required status checks.
    name: Required checks
    if: always()
    runs-on: ubuntu-slim
    permissions: {}

    needs:
      - lint
      - build
      - publish

    steps:
      - name: Check results
        shell: python
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          import json, os, sys

          ok = all(
            result == "success"
            for result in json.loads(os.environ["RESULTS"])
          )

          sys.exit(not ok)
