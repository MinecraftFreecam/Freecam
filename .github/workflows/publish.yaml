name: Publish

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to publish
        type: string
        default: ${{ github.sha }}
      version:
        description: Version to publish (required unless dry-run)
        type: string
        required: false
      dry-run:
        description: Dry run
        type: boolean
        default: false
    secrets:
       MODRINTH_TOKEN:
         description: Modrinth API token (required unless dry-run)
         required: false
       CURSEFORGE_TOKEN:
         description: CurseForge API token (required unless dry-run)
         required: false
    outputs: {}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: ${{ inputs.dry-run && 'dry run' || 'Release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Grant 'write' to create releases.
      contents: write

    steps:
      - name: Checkout changelog
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
        if: ${{ !inputs.dry-run }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare Release Notes
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          TARGET_VERSION: ${{ inputs.version }}
        with:
          script: |
            const fs = require('fs');

            if (process.env.DRY_RUN === 'true') {
              fs.writeFileSync('artifacts/release-notes.md', 'Mock release notes.');
              return;
            }

            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const version = process.env.TARGET_VERSION;

            // Split on h2 headings and look for a section that starts with our version header
            // We format version headers as "## [1.2.3] - YYYY-MM-DD"
            const section = changelog.split(/^## +/m).find(c => c.startsWith(`[${version}]`));

            if (!section) {
              core.setFailed(`Version ${version} not found in CHANGELOG.md`);
              return;
            }

            // Strip the header line itself to isolate the body
            const body = section.substring(section.indexOf('\n') + 1).trim();

            fs.writeFileSync('artifacts/release-notes.md', body);

      - name: Publish GitHub Release
        env:
          dry_run: ${{ inputs.dry-run || '' }}
          ref: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          shopt -s nullglob

          meta=artifacts/release-metadata.json
          files=( artifacts/release-*.json )
          [ ${#files[@]} = 1 ] || {
            echo "::error::Found ${#files[@]} release json artifacts, expected 1"
            exit 1
          }
          mv "${files[0]}" "$meta"

          version=$(jq .mod_version "$meta" --raw-output)
          title=$(jq .display_name "$meta" --raw-output)

          args=(
            --repo "$GITHUB_REPOSITORY"
            release create "v$version"
            --target "$ref"
            --title "$title"
            --notes-file artifacts/release-notes.md
          )

          jq '.release_type == "release"' "$meta" --exit-status >/dev/null || {
            args+=( --prerelease )
          }

          args+=( "$meta" artifacts/*.jar )

          if [ -n "$dry_run" ]; then
            echo "Dry run:"
            printf ' %q' gh "${args[@]}"
            echo
          else
            gh "${args[@]}"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Freecam Publisher
        uses: MinecraftFreecam/Publisher@v0.0.6

      - name: Publish to CurseForge & Modrinth
        env:
          dry_run: ${{ inputs.dry-run || '' }}
          MODRINTH_TOKEN: ${{ inputs.dry-run && 'token' || secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ inputs.dry-run && 'token' || secrets.CURSEFORGE_TOKEN }}
        run: |
          echo "::notice::Using $(freecam-publish --version)"
          args=(
            --metadata artifacts/release-metadata.json
            artifacts
          )
          if [ -n "$dry_run" ]; then
            echo "Dry run:"
            args+=( --dry-run )
          fi
          freecam-publish "${args[@]}"
